<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="AulaVanguardia (A.V)">
    <title>AulaVanguardia</title>

    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <div class="titulo">
            <div>
                <img class="logo" src="static/img/aula.png" alt="Logo">
            </div>
            <div>
                <h1>AulaVanguardia (A.V)</h1>
            </div>
        </div>
        <nav class="barraNav">
            <button class="textoNav" onclick="Iniciar-Sesion">Iniciar Sesion</button>
            <button class="textoNav" onclick="Soporte">Soporte</button>
        </nav>
    </header>

    <main>
        <section class="bienvenida">
            ¡Bienvenido/a!
        </section>
        <section class="opciones">
            <div class="caja">
                <boton class="boton">Mapa</boton>
                <div class="imagen-boton">
                    <img src="static/img/mapa.png" alt="Mapa">
                </div>
            </div>
            <div class="caja">
                <boton class="boton">Comunicados</boton>
                <div class="imagen-boton">
                    <img src="static/img/comunicado.png" alt="Comunicado">
                </div>
            </div>
            <div class="caja">
                <boton class="boton">Control parental</boton>
                <div class="imagen-boton">
                    <img src="static/img/control_parental.png" alt="Control parental">
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <section class="footer-alto">
            <p>
                ¡Buscamos tu seguridad en el entorno escolar!
            </p>
        </section>
        <section class="footer-bajo">
            <p>
                Todos los derechos reservados
            </p>
        </section>
    </footer>
    <script src="static/js/script.js"></script>
</body>

</html>
